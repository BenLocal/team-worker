name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            docker/ops/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: internal/board/web/package-lock.json

      # The live-terminal tests drive a real tmux server and skip without one.
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tmux

      # The board page is embedded into the binaries; without it the board
      # tests that need the page are skipped.
      - name: Build the board page
        run: make web

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Test docker/ops
        working-directory: docker/ops
        run: |
          go vet ./...
          go test ./...

      # The CLI must keep building for every platform make dist ships.
      - name: Cross-build the CLI
        run: make dist

      - name: Check shell scripts
        run: for f in docker/*.sh; do bash -n "$f"; done

  python:
    name: Skill scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Test the teamworker skill
        run: python3 -m unittest discover -s skills/teamworker/tests -v
