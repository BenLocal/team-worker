name: Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - docker/**
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # The image is about 8 GB; the runner needs room for its layers and the
      # build cache, so drop toolchains the build does not use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            docker/ops/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: internal/board/web/package-lock.json

      # Like team-worker.sh build: the board page and static binaries are built
      # here and handed to the Dockerfile as the bins build context.
      - name: Build the binaries
        run: ./docker/team-worker.sh bins

      - uses: docker/setup-buildx-action@v4

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/team-worker
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      # Pull requests only check that the image builds.
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No GitHub Actions cache: the layers alone outgrow its 10 GB limit.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          build-contexts: bins=bin/docker
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
