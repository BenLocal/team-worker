# Sources are paths inside the container or repository URLs accepted by Magpie.
# sources:
#   - source: /workspace/aiclass-skills/skills
#     agents: [claude]
# The image exports agent-desktop's version-matched skills here, so every
# agent can operate the container's virtual desktop.
sources:
  - source: /opt/agent-desktop/skills
    agents: [claude, codex, dsh, pi]
