# Included in /magpie/ when TEAM_WORKER_MAGPIE_SESSION_LOGIN=1: a board
# session signs the viewer in to Magpie without its key.
auth_request /_auth/magpie;
auth_request_set $magpie_key $upstream_http_x_magpie_key;
error_page 401 = @board_sign_in;
proxy_set_header Cookie "magpie_web_3430=$magpie_key; $http_cookie";
