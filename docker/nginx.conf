worker_processes auto;
pid /tmp/team-worker-nginx.pid;
error_log stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    access_log off;
    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    client_max_body_size 32m;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' '';
    }
    # A location that sets any proxy_set_header inherits none of these, so the
    # ones that also clear Accept-Encoding include the same file again.
    include /etc/nginx/team-worker-proxy.conf;
    server {
        listen 8080 default_server;
        server_name _;
        absolute_redirect off;
        location = / { return 302 /team-worker/; }
        location = /team-worker { return 308 /team-worker/$is_args$args; }
        location = /magpie { return 308 /magpie/$is_args$args; }
        location /team-worker-api/ {
            proxy_pass http://127.0.0.1:8082/;
            include /etc/nginx/team-worker-proxy.conf;
        }
        location = /_proxy/subpath.js {
            alias /etc/nginx/subpath.js;
            default_type application/javascript;
        }
        # team-workerd serves the board beside its API (/v1/) on one port.
        location /team-worker/ {
            proxy_pass http://127.0.0.1:8082/;
            include /etc/nginx/team-worker-proxy.conf;
            proxy_set_header Accept-Encoding "";
            sub_filter_once on;
            sub_filter '<head>' '<head><script src="/_proxy/subpath.js" data-prefix="/team-worker"></script>';
            # The authenticated board emits redirects with its public prefix.
            proxy_redirect off;
        }
        # With session sign-in, team-workerd answers this check with Magpie's
        # key, which goes upstream as Magpie's cookie.
        location = /_auth/magpie {
            internal;
            proxy_pass http://127.0.0.1:8082/api/service-auth/magpie;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
        }
        # The board comes back to Magpie once the viewer is signed in.
        location @board_sign_in { return 302 /team-worker/?next=/magpie/; }
        location /magpie/ {
            # TEAM_WORKER_MAGPIE_SESSION_LOGIN=1: the entrypoint puts the
            # session check here; otherwise Magpie asks for its own key.
            include /tmp/team-worker-nginx/magpie-session*.conf;
            proxy_pass http://127.0.0.1:3430/;
            include /etc/nginx/team-worker-proxy.conf;
            proxy_set_header Accept-Encoding "";
            sub_filter_once off;
            sub_filter '<head>' '<head><script src="/_proxy/subpath.js" data-prefix="/magpie"></script>';
            sub_filter 'action="/_magpie/' 'action="/magpie/_magpie/';
            proxy_redirect ~^(/.*)$ /magpie$1;
            proxy_cookie_path / /magpie/;
        }
        # OpenBao (TEAM_WORKER_OPENBAO=1): its UI loads assets from /ui/ and calls /v1/,
        # so both stay at the root instead of under a prefix.
        # TEAM_WORKER_OPENBAO_SESSION_LOGIN=1 sends this to team-workerd's
        # /api/openbao/login, which signs the board viewer in to the UI.
        location = /openbao {
            include /tmp/team-worker-nginx/openbao-session*.conf;
            return 302 /ui/;
        }
        location /ui/ { proxy_pass http://127.0.0.1:8200; }
        location /v1/ { proxy_pass http://127.0.0.1:8200; }
        location / { return 404; }
    }
}
