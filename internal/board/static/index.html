<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>team-worker board</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --line: #e3e6ea; --text: #1d2228; --muted: #6b7380;
  --accent: #2f6fdf; --ok: #1f8a4c; --warn: #b7791f; --bad: #c0392b; --idle: #8a94a3;
  --term-bg: #15181d; --term-fg: #d7dce2;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111418; --panel: #191d23; --line: #2a3038; --text: #e3e7ec; --muted: #8b95a3;
    --accent: #6c9cf0; --ok: #4cc27f; --warn: #e0a94a; --bad: #ef6b5b; --idle: #6b7380;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.45 -apple-system, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", sans-serif; }
header { display: flex; align-items: center; gap: 12px; padding: 12px 20px;
  border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 2; }
header h1 { font-size: 16px; margin: 0; font-weight: 600; }
select { font: inherit; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--bg); color: var(--text); }
.summary { color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }
main { display: grid; grid-template-columns: 260px 1fr 320px; gap: 16px; padding: 16px 20px; }
@media (max-width: 1100px) { main { grid-template-columns: 1fr; } }
section h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
  margin: 0 0 8px; font-weight: 600; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
  margin-bottom: 8px; }
.member { cursor: pointer; }
.member:hover { border-color: var(--accent); }
.member .top { display: flex; align-items: center; gap: 8px; }
.member .name { font-weight: 600; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--idle); flex: none; }
.dot.alive { background: var(--ok); } .dot.dead { background: var(--bad); }
.meta { color: var(--muted); font-size: 12px; }
.badge { font-size: 11px; padding: 1px 6px; border-radius: 10px; border: 1px solid var(--line); color: var(--muted); }
.badge.inbox { color: var(--accent); border-color: var(--accent); margin-left: auto; }
.kanban { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 800px) { .kanban { grid-template-columns: 1fr 1fr; } }
.col { background: color-mix(in srgb, var(--panel) 55%, var(--bg)); border: 1px solid var(--line);
  border-radius: 8px; padding: 8px; min-height: 120px; }
.col h3 { font-size: 12px; margin: 2px 4px 8px; color: var(--muted); font-weight: 600;
  display: flex; justify-content: space-between; }
.task .subject { font-weight: 500; overflow-wrap: anywhere; }
.task .line { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.prio-urgent { color: var(--bad); border-color: var(--bad); }
.prio-high { color: var(--warn); border-color: var(--warn); }
.messages { max-height: calc(100vh - 120px); overflow: auto; }
.msg .head { display: flex; gap: 6px; font-size: 12px; color: var(--muted); }
.msg .head b { color: var(--text); font-weight: 600; }
.msg .body { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 2px; }
.empty { color: var(--muted); font-size: 13px; padding: 8px 4px; }
.error { color: var(--bad); padding: 16px 20px; }
dialog { width: min(1000px, 94vw); height: min(720px, 88vh); border: 1px solid var(--line);
  border-radius: 10px; padding: 0; background: var(--term-bg); color: var(--term-fg); }
dialog::backdrop { background: rgb(0 0 0 / .45); }
dialog .bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid #2a3038;
  font-size: 13px; }
dialog .bar button { margin-left: auto; font: inherit; background: none; color: inherit; border: 1px solid #3a414b;
  border-radius: 6px; padding: 2px 10px; cursor: pointer; }
dialog pre { margin: 0; padding: 12px; height: calc(100% - 42px); overflow: auto;
  font: 12.5px/1.35 "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; white-space: pre; }
</style>
</head>
<body>
<header>
  <h1>team-worker</h1>
  <select id="team" aria-label="Team"></select>
  <span class="summary" id="summary"></span>
</header>
<div id="error" class="error" hidden></div>
<main>
  <section><h2>Members</h2><div id="members"></div></section>
  <section><h2>Tasks</h2><div class="kanban" id="kanban"></div></section>
  <section><h2>Messages</h2><div class="messages" id="messages"></div></section>
</main>
<dialog id="screen">
  <div class="bar"><span id="screen-title"></span><button id="screen-close">Close</button></div>
  <pre id="screen-text"></pre>
</dialog>
<script>
const $ = (id) => document.getElementById(id);
const columns = [["pending", "Pending"], ["in_progress", "In progress"], ["blocked", "Blocked"], ["completed", "Completed"]];
let team = new URLSearchParams(location.search).get("team") || "";
let screenAgent = null;

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v; else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  for (const c of children.flat()) if (c != null) node.append(c);
  return node;
}
const time = (ts) => ts ? new Date(ts).toLocaleTimeString() : "";
async function api(path) {
  const res = await fetch(path);
  const body = await res.json();
  if (!res.ok) throw new Error(body.error || res.statusText);
  return body;
}

function agentState(m) {
  const a = m.agent;
  if (!a) return ["", "not spawned"];
  if (a.status === "exited") return ["dead", "exited"];
  if (a.alive === true) return ["alive", "running"];
  if (a.alive === false) return ["dead", "dead"];
  return ["", "unknown"];
}

function renderMembers(board) {
  $("members").replaceChildren(...board.members.map((m) => {
    const [cls, label] = agentState(m);
    const isLeader = m.agentId === board.team.leadAgentId;
    return el("div", { class: "card member", title: m.agent ? "Show terminal" : "",
        onclick: () => m.agent && openScreen(m.name) },
      el("div", { class: "top" }, el("span", { class: "dot " + cls }), el("span", { class: "name" }, m.name),
        m.inboxCount ? el("span", { class: "badge inbox" }, m.inboxCount + " unread") : null),
      el("div", { class: "meta" }, (isLeader ? "leader · " : "") + m.agentType + " · " + label));
  }));
}

function renderTasks(board) {
  const byId = Object.fromEntries(board.tasks.map((t) => [t.id, t]));
  $("kanban").replaceChildren(...columns.map(([status, title]) => {
    const tasks = board.tasks.filter((t) => t.status === status);
    return el("div", { class: "col" },
      el("h3", {}, el("span", {}, title), el("span", {}, String(tasks.length))),
      tasks.length ? tasks.map((t) => el("div", { class: "card task" },
        el("div", { class: "subject" }, t.subject),
        el("div", { class: "line" },
          el("span", { class: "badge" }, t.id),
          t.priority !== "medium" ? el("span", { class: "badge prio-" + t.priority }, t.priority) : null,
          t.owner ? el("span", { class: "badge" }, "@" + t.owner) : null),
        t.blockedBy.length ? el("div", { class: "meta" },
          "waits for " + t.blockedBy.map((id) => byId[id] ? byId[id].subject : id).join(", ")) : null))
        : el("div", { class: "empty" }, "—"));
  }));
  const s = board.taskSummary;
  $("summary").textContent = `${s.completed}/${s.total} done · ${s.in_progress} in progress · ${s.blocked} blocked`;
}

function renderMessages(board) {
  const msgs = [...board.messages].reverse();
  $("messages").replaceChildren(...(msgs.length ? msgs.map((m) => el("div", { class: "card msg" },
    el("div", { class: "head" }, el("b", {}, m.from), "→", el("span", {}, m.to || "all"),
      m.type !== "message" ? el("span", { class: "badge" }, m.type) : null,
      el("span", { style: "margin-left:auto" }, time(m.timestamp))),
    el("div", { class: "body" }, m.content))) : [el("div", { class: "empty" }, "No messages yet")]));
}

async function loadTeams() {
  const teams = await api("/api/teams");
  if (!team && teams.length) team = teams[0].name;
  $("team").replaceChildren(...teams.map((t) => el("option", { value: t.name }, t.name)));
  $("team").value = team;
}

async function refresh() {
  if (!team) { $("summary").textContent = "No teams yet"; return; }
  try {
    const board = await api("/api/teams/" + encodeURIComponent(team));
    $("error").hidden = true;
    renderMembers(board); renderTasks(board); renderMessages(board);
  } catch (e) {
    $("error").hidden = false; $("error").textContent = e.message;
  }
}

async function refreshScreen() {
  if (!screenAgent) return;
  try {
    const res = await api(`/api/teams/${encodeURIComponent(team)}/agents/${encodeURIComponent(screenAgent)}/screen?history=200`);
    const pre = $("screen-text");
    const atBottom = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 4;
    pre.textContent = res.screen;
    if (atBottom) pre.scrollTop = pre.scrollHeight;
  } catch (e) {
    $("screen-text").textContent = e.message;
  }
}

function openScreen(name) {
  screenAgent = name;
  $("screen-title").textContent = name + " · read-only";
  $("screen-text").textContent = "";
  $("screen").showModal();
  refreshScreen();
}
$("screen-close").addEventListener("click", () => $("screen").close());
$("screen").addEventListener("close", () => { screenAgent = null; });
$("team").addEventListener("change", (e) => {
  team = e.target.value;
  history.replaceState(null, "", "?team=" + encodeURIComponent(team));
  refresh();
});

loadTeams().then(refresh).catch((e) => { $("error").hidden = false; $("error").textContent = e.message; });
setInterval(refresh, 2000);
setInterval(refreshScreen, 1000);
setInterval(() => loadTeams().catch(() => {}), 15000);
</script>
</body>
</html>
